<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - Bukadita</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #578FCA 0%, #27548A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #27548A;
            margin-bottom: 20px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #578FCA 0%, #27548A 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(87, 143, 202, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #578FCA;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Clear Cache</h1>
        <p>Jika Anda mengalami masalah scrolling atau tampilan yang tidak normal di PWA, klik tombol di bawah untuk membersihkan cache dan memuat ulang aplikasi.</p>
        
        <button class="btn" onclick="clearAllCaches()">Bersihkan Cache & Reload</button>
        <button class="btn" onclick="unregisterServiceWorker()">Unregister Service Worker</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function clearAllCaches() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="spinner"></div><p>Membersihkan cache...</p>';
            
            try {
                // Clear all caches
                const cacheNames = await caches.keys();
                await Promise.all(
                    cacheNames.map(cacheName => {
                        console.log('Deleting cache:', cacheName);
                        return caches.delete(cacheName);
                    })
                );
                
                // Clear localStorage
                localStorage.clear();
                
                // Clear sessionStorage
                sessionStorage.clear();
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✅ Cache berhasil dibersihkan! Halaman akan dimuat ulang dalam 2 detik...';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                console.error('Error clearing cache:', error);
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '❌ Gagal membersihkan cache: ' + error.message;
            }
        }

        async function unregisterServiceWorker() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="spinner"></div><p>Unregistering service worker...</p>';
            
            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                
                if (registrations.length === 0) {
                    statusDiv.className = 'status info';
                    statusDiv.innerHTML = 'ℹ️ Tidak ada service worker yang terdaftar.';
                    return;
                }
                
                await Promise.all(
                    registrations.map(registration => {
                        console.log('Unregistering SW:', registration);
                        return registration.unregister();
                    })
                );
                
                // Also clear caches
                const cacheNames = await caches.keys();
                await Promise.all(
                    cacheNames.map(cacheName => caches.delete(cacheName))
                );
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✅ Service Worker berhasil di-unregister! Halaman akan dimuat ulang dalam 2 detik...';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (error) {
                console.error('Error unregistering SW:', error);
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '❌ Gagal unregister service worker: ' + error.message;
            }
        }
    </script>
</body>
</html>
